<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>My Archive</title>
<meta name="description" content="나만의 카페·맛집·아이템 스크랩북">
<meta name="theme-color" content="#FAF8F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Archive">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="stylesheet" href="./assets/css/style.css?v=3">
<script>
  window.__errs = [];
  addEventListener('error', function (e) { window.__errs.push(String((e && e.message) || e)); });
  addEventListener('unhandledrejection', function (e) { window.__errs.push('promise: ' + String(e && e.reason)); });
</script>
</head>
<body>

<div class="top-stack" id="topStack">
<header class="app-header">
  <div class="header-row">
    <div class="brand">
      <p class="eyebrow">Personal Scrapbook</p>
      <h1>My Archive</h1>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="더보기" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
    </button>
  </div>
  <div class="search-wrap">
    <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="searchInput" type="search" placeholder="제목 · 메모 · 태그로 찾기" autocomplete="off" spellcheck="false" aria-label="검색">
    <button id="clearSearch" class="clear-btn" hidden aria-label="검색어 지우기">×</button>
  </div>
</header>

<nav class="filters" aria-label="필터">
  <div class="chips cat-chips" id="catChips"></div>
  <div class="chips src-chips" id="srcChips"></div>
</nav>
</div>

<main>
  <p class="result-line"><span id="countText">불러오는 중…</span></p>
  <div class="grid" id="grid" aria-live="polite"></div>
  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="14" width="44" height="38" rx="4"/><path d="M10 24h44M22 14v10"/><circle cx="26" cy="38" r="4"/><path d="M34 44l8-8 8 8"/></svg>
    <p class="empty-title">조건에 맞는 기록이 없어요</p>
    <p class="empty-sub">검색어나 필터를 바꿔 보세요.</p>
  </div>
</main>

<footer class="app-foot">
  <span>My Archive · <span id="footCount">0</span>개의 기록</span>
</footer>

<button class="fab" id="fab" aria-label="새 기록 추가">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="backdrop" id="backdrop" hidden></div>

<!-- Detail sheet -->
<section class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="sheet-head"><div class="grab"></div><button class="sheet-close" id="detailClose" aria-label="닫기">×</button></div>
  <div class="detail-hero" id="dHero"><img id="dImg" alt=""></div>
  <div class="detail-body">
    <div class="detail-top">
      <span class="badge solid" id="dCat"></span>
      <button class="fav-btn" id="dFav" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.63 5.33 5.88.86-4.25 4.14 1 5.86L12 17.02l-5.26 2.77 1-5.86L3.49 9.79l5.88-.86z"/></svg>
        <span>즐겨찾기</span>
      </button>
    </div>
    <h2 id="dTitle"></h2>
    <p class="detail-meta"><span id="dDate"></span><span class="dot">·</span><span id="dSource"></span></p>
    <p class="detail-note" id="dNote"></p>
    <div class="tag-row" id="dTags"></div>
    <a class="btn primary link-btn" id="dLink" target="_blank" rel="noopener noreferrer" hidden>
      <span id="dLinkText">링크 열기</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>
    <div class="memo-block">
      <label class="memo-label" for="dMemo">나의 메모</label>
      <textarea id="dMemo" rows="3" placeholder="이곳에 대해 기억하고 싶은 것을 적어 두세요."></textarea>
      <div class="memo-actions">
        <button class="btn small primary" id="memoSave">메모 저장</button>
        <button class="btn small ghost" id="memoClear">메모 삭제</button>
      </div>
    </div>
    <div class="detail-foot" id="detailFoot" hidden>
      <button class="btn small ghost" id="dEdit">항목 수정</button>
      <button class="btn small danger" id="dDelete">항목 삭제</button>
    </div>
  </div>
</section>

<!-- Add / edit sheet -->
<section class="sheet" id="formSheet" role="dialog" aria-modal="true" aria-labelledby="formTitle" hidden>
  <div class="sheet-head"><div class="grab"></div><button class="sheet-close" id="formClose" aria-label="닫기">×</button></div>
  <form id="itemForm" class="form" novalidate>
    <h2 id="formTitle">새 기록 추가</h2>
    <label class="field">
      <span>제목 <em>*</em></span>
      <input id="fTitle" type="text" maxlength="80" required placeholder="예) 찻집 달리아">
    </label>
    <label class="field">
      <span>카테고리</span>
      <select id="fCat">
        <option>카페</option><option>맛집</option><option>아이템</option>
        <option>링크·계정</option><option>여행·숙소</option><option>볼거리</option>
      </select>
    </label>
    <label class="field">
      <span>링크</span>
      <input id="fUrl" type="url" inputmode="url" placeholder="https://">
    </label>
    <label class="field">
      <span>메모</span>
      <textarea id="fNote" rows="3" placeholder="주소, 영업시간, 기억할 점"></textarea>
    </label>
    <label class="field">
      <span>태그</span>
      <input id="fTags" type="text" placeholder="쉼표로 구분 (예: 압구정, 차전문)">
    </label>
    <div class="field">
      <span>사진</span>
      <input id="fPhoto" type="file" accept="image/*" hidden>
      <button type="button" class="photo-picker" id="photoPicker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l5-5 4 4 2-2 3 3"/></svg>
        <span id="photoLabel">사진 선택</span>
      </button>
      <div class="photo-preview" id="photoPreview" hidden><img id="photoImg" alt=""><button type="button" id="photoRemove" aria-label="사진 빼기">×</button></div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn ghost" id="fCancel">취소</button>
      <button type="submit" class="btn primary" id="fSave">저장</button>
    </div>
  </form>
</section>

<!-- Info sheet -->
<section class="sheet" id="infoSheet" role="dialog" aria-modal="true" aria-label="안내" hidden>
  <div class="sheet-head"><div class="grab"></div><button class="sheet-close" id="infoClose" aria-label="닫기">×</button></div>
  <div class="info-body" id="infoBody"></div>
</section>

<!-- Menu -->
<div class="menu-pop" id="menuPop" hidden>
  <button data-act="export">JSON으로 백업</button>
  <button data-act="import">백업 가져오기</button>
  <button data-act="install">홈 화면에 추가하기</button>
  <button data-act="about">이 앱에 대하여</button>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./assets/js/app.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive — phone preview</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #F2F2F4;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  .stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .phone {
    width: 380px; height: 820px;
    padding: 9px;
    box-sizing: content-box;
    border-radius: 50px;
    background: #111;
    box-shadow: 0 40px 80px -24px rgba(17, 17, 17, 0.45), 0 2px 8px rgba(17, 17, 17, 0.18);
    transform-origin: center center;
  }
  iframe {
    width: 380px; height: 820px;
    border: 0; display: block; background: #fff;
    border-radius: 41px; overflow: hidden;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <iframe src="./index.html" title="Archive preview" scrolling="no"></iframe>
    </div>
  </div>
<script>
  (function () {
    var phone = document.getElementById('phone');
    function fit() {
      var s = Math.min(1, (window.innerWidth - 48) / 398, (window.innerHeight - 48) / 838);
      phone.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
